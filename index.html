<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Kelas AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#241552;
  --ungu:#6b3fd4;
  --kuning:#ffd23f;
  --latar:#efeaff;
  --putih:#ffffff;
  --abu:#5f5680;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--latar);color:var(--tinta);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.55}
header{background:var(--tinta);color:#fff;padding:28px 18px 34px;border-bottom:6px solid var(--kuning)}
.dalam{max-width:720px;margin:0 auto}
header h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:1.9rem;line-height:1.15;margin:0}
header p{margin:6px 0 0;color:#cfc6ee;font-size:.95rem}
header a{color:var(--kuning);font-weight:700;text-decoration:none;display:inline-block;margin-bottom:10px}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.stiker{background:var(--putih);border:3px solid var(--tinta);border-radius:22px;padding:14px;box-shadow:5px 5px 0 var(--ungu)}
.stiker h2{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.05rem;margin:0 0 10px;word-break:break-word}
.stiker a.gambar{display:block}
.stiker img{width:100%;height:auto;display:block;border-radius:14px;background:#f6f3ff}
.catatan{white-space:pre-wrap;word-break:break-word;font-size:.98rem}
.tombol{display:inline-block;background:var(--ungu);color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:12px}
.tombol:focus-visible,a:focus-visible{outline:3px solid var(--kuning);outline-offset:2px}
.siswa{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--tinta);text-decoration:none;font-family:"Baloo 2",system-ui,sans-serif;font-weight:600;font-size:1.15rem}
.siswa span:last-child{background:var(--kuning);border-radius:999px;padding:2px 14px;font-size:.95rem}
.info{background:var(--putih);border-radius:18px;padding:22px 18px;text-align:center;color:var(--abu)}
.info strong{display:block;color:var(--tinta);font-family:"Baloo 2",system-ui,sans-serif;font-size:1.1rem;margin-bottom:4px}
@media (min-width:600px){
  .grid.hasil{grid-template-columns:1fr 1fr}
  .grid.hasil .lebar{grid-column:1 / -1}
}
</style>
</head>
<body>
<header>
  <div class="dalam" id="kepala"></div>
</header>
<main>
  <div id="isi" class="grid"></div>
</main>

<script>
/* ===== PENGATURAN (biasanya tidak perlu diubah) =====
   Alamat otomatis terbaca dari link GitHub Pages.
   Isi manual hanya jika memakai domain sendiri. */
const PENGGUNA = "";   // contoh: "kelas-ai-shoda"
const REPO = "";       // contoh: "galeri-kelas-ai"
const FOLDER = "siswa";

const GAMBAR = ["png","jpg","jpeg","gif","webp","svg"];
const TEKS = ["md","txt"];

const kepala = document.getElementById("kepala");
const isi = document.getElementById("isi");

function el(tag, kelas, teks){
  const e = document.createElement(tag);
  if(kelas) e.className = kelas;
  if(teks !== undefined) e.textContent = teks;
  return e;
}

function tentukanRepo(){
  let user = PENGGUNA, repo = REPO;
  const host = location.hostname;
  if(!user && host.endsWith(".github.io")){
    user = host.split(".")[0];
    const bagian = location.pathname.split("/")[1] || "";
    repo = repo || ((bagian && !bagian.endsWith(".html")) ? bagian : host);
  }
  return {user, repo};
}

function rapikanNama(s){
  const n = decodeURIComponent(s).replace(/[-_]+/g," ");
  return n.charAt(0).toUpperCase() + n.slice(1);
}

function pesan(judul, rincian){
  isi.replaceChildren();
  const k = el("div","info");
  k.appendChild(el("strong","",judul));
  k.appendChild(document.createTextNode(rincian));
  isi.appendChild(k);
}

async function daftarIsi(user, repo, jalur){
  const url = "https://api.github.com/repos/" + user + "/" + repo + "/contents/" + jalur;
  const r = await fetch(url);
  if(!r.ok) throw new Error(String(r.status));
  return r.json();
}

async function tampilkanSiswa(s, user, repo){
  const nama = rapikanNama(s);
  document.title = "Karya " + nama + " | Kelas AI";
  kepala.replaceChildren();
  const balik = el("a","","‹ Semua karya kelas");
  balik.href = location.pathname;
  kepala.appendChild(balik);
  kepala.appendChild(el("h1","","Karya " + nama));
  kepala.appendChild(el("p","","Hasil belajar di kelas AI"));
  isi.className = "grid hasil";

  let berkas;
  try{
    berkas = (await daftarIsi(user, repo, FOLDER + "/" + encodeURIComponent(s))).filter(f => f.type === "file");
  }catch(e){
    pesan("Karya belum ditemukan", "Periksa kembali link-nya, atau coba lagi beberapa menit lagi.");
    isi.className = "grid";
    return;
  }
  berkas.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}));
  if(!berkas.length){
    pesan("Belum ada karya", "Folder ini masih kosong.");
    isi.className = "grid";
    return;
  }
  isi.replaceChildren();
  for(const f of berkas){
    const ext = f.name.split(".").pop().toLowerCase();
    const jalur = FOLDER + "/" + encodeURIComponent(s) + "/" + encodeURIComponent(f.name);
    const judul = f.name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," ");
    const kartu = el("section","stiker");
    kartu.appendChild(el("h2","",judul));
    if(GAMBAR.includes(ext)){
      const a = el("a","gambar");
      a.href = jalur; a.target = "_blank"; a.rel = "noopener";
      const img = document.createElement("img");
      img.src = jalur; img.alt = judul; img.loading = "lazy";
      a.appendChild(img);
      kartu.appendChild(a);
    }else if(TEKS.includes(ext)){
      kartu.classList.add("lebar");
      const p = el("div","catatan","Memuat…");
      kartu.appendChild(p);
      fetch(jalur).then(r => r.text()).then(t => { p.textContent = t; }).catch(() => { p.textContent = "Catatan tidak bisa dimuat."; });
    }else{
      kartu.classList.add("lebar");
      const a = el("a","tombol", ext === "pdf" ? "Buka PDF" : "Buka file");
      a.href = jalur; a.target = "_blank"; a.rel = "noopener";
      kartu.appendChild(a);
    }
    isi.appendChild(kartu);
  }
}

async function tampilkanKelas(user, repo){
  document.title = "Galeri Kelas AI";
  kepala.replaceChildren();
  kepala.appendChild(el("h1","","Galeri Kelas AI"));
  kepala.appendChild(el("p","","Pilih nama untuk melihat karya"));
  isi.className = "grid";
  let folder;
  try{
    folder = (await daftarIsi(user, repo, FOLDER)).filter(f => f.type === "dir");
  }catch(e){
    pesan("Galeri belum bisa dimuat", "Pastikan folder “" + FOLDER + "” sudah ada, lalu muat ulang halaman.");
    return;
  }
  if(!folder.length){ pesan("Belum ada karya", "Belum ada folder siswa."); return; }
  isi.replaceChildren();
  folder.sort((a,b) => a.name.localeCompare(b.name));
  for(const f of folder){
    const kartu = el("section","stiker");
    const a = el("a","siswa");
    a.href = "?s=" + encodeURIComponent(f.name);
    a.appendChild(el("span","",rapikanNama(f.name)));
    a.appendChild(el("span","","Lihat"));
    kartu.appendChild(a);
    isi.appendChild(kartu);
  }
}

(function mulai(){
  const {user, repo} = tentukanRepo();
  if(!user || !repo){
    kepala.appendChild(el("h1","","Galeri Kelas AI"));
    pesan("Alamat belum terbaca", "Buka halaman ini lewat link GitHub Pages, atau isi PENGGUNA dan REPO di bagian atas skrip.");
    return;
  }
  const s = new URLSearchParams(location.search).get("s");
  if(s && /^[A-Za-z0-9._ -]+$/.test(s) && !s.includes("..")){
    tampilkanSiswa(s, user, repo);
  }else{
    tampilkanKelas(user, repo);
  }
})();
</script>
</body>
</html>
